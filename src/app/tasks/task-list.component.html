<ng-container *ngIf="view$ | async as view">
  <ion-header>
    <ion-toolbar>
      <ion-title>Assigned Tasks</ion-title>
      <ion-badge slot="end" [color]="view.online ? 'success' : 'warning'">
        {{ view.online ? 'Online' : 'Offline' }}
      </ion-badge>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <p role="alert" *ngIf="view.error">{{ view.error }}</p>

    <ion-item lines="none">
      <ion-label>Queued conflicts</ion-label>
      <ion-button slot="end" fill="clear" routerLink="/conflicts">Review</ion-button>
      <ion-button slot="end" fill="clear" color="medium" (click)="signOut()">Sign out</ion-button>
    </ion-item>

    <ion-list *ngIf="view.tasks.length || !view.loading; else skeletonState">
      <ion-item *ngFor="let task of view.tasks; trackBy: trackTask" [routerLink]="['/tasks', task.id, 'report']">
        {{ task.title }} · {{ task.assetId }}
      </ion-item>
    </ion-list>

    <ng-template #skeletonState>
      <ion-list>
        <ion-item *ngFor="let item of [1,2,3]; let i = index" lines="full">
          <ion-label>
            <ion-skeleton-text animated style="width: 60%;"></ion-skeleton-text>
            <ion-skeleton-text animated style="width: 35%; margin-top: 8px;"></ion-skeleton-text>
          </ion-label>
        </ion-item>
      </ion-list>
    </ng-template>

    <ng-template [ngIf]="view.tasks.length === 0 && !view.loading">
      <ion-item lines="none">
        <ion-label class="ion-text-center">
          <h2>No tasks assigned</h2>
          <p *ngIf="view.error; else noTasksHint">{{ view.error }}</p>
          <ng-template #noTasksHint>
            <p>Everything is current right now. New work will appear here when it is assigned.</p>
          </ng-template>
        </ion-label>
      </ion-item>
    </ng-template>
  </ion-content>
</ng-container>
